<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="author" content="Pavlo Kodzhebash">
    <title>Bear Ninja Hunter</title>
</head>
<body>
    <h1>Bear Ninja Hunter</h1>
    <p id="demo">Replace this content with the game results</p>

    <script>
        // Ask for player's name
        let playerName = prompt("Enter your name to play Bear Ninja Hunter:");

        // Greet the player with an alert
        alert(`Welcome to Bear Ninja Hunter, ${playerName}!`);

        // Ask for player's choice
        let playerChoice = prompt("Enter your choice: Bear, Ninja, or Hunter");

        // Computer's choice (hard-coded to Bear)
        let computerChoice = "Bear";

        // Create the game result message
        let resultMessage = playerName + " chose " + playerChoice + ". Computer chose " + computerChoice + ".";

        // Display the result on the HTML page
        document.getElementById("demo").innerHTML = resultMessage;

        // Display the result in the console
        console.log(`${playerName} chose ${playerChoice}. Computer chose ${computerChoice}.`);

        // Example of escape character for apostrophe
        alert('Let\'s play Bear Ninja Hunter!');

        // Additional console logs demonstrating concatenation
        console.log("Result using + : " + playerName + " vs " + computerChoice);
        console.log(`Result using template literals: ${playerName} vs ${computerChoice}`);
    </script>
</body>
</html>
