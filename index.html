<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="author" content="Your Name">
    <title>Bear Ninja Hunter</title>
</head>
<body>

<h1>Bear Ninja Hunter</h1>
<p id="demo">Your game results will appear here!</p>

<script>

    let playerName = prompt("To continue, please enter your name:");

    alert(`Hello ${playerName}! Welcome to Bear Ninja Hunter!`);

    let playerChoice = prompt("Choose your character: Bear, Ninja, or Hunter");

    const computerChoice = "Bear";
    
    document.getElementById("demo").innerHTML = 
        `Player: ${playerName} chose ${playerChoice}. Computer chose ${computerChoice}.`;
    
    console.log(`Player: ${playerName} chose ${playerChoice}. Computer chose ${computerChoice}.`);

</script>

</body>
</html>
